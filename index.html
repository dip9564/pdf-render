<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Render — All-in-One PDF Editor & Generator</title>
    <meta name="description" content="Create, edit, merge, split, compress, and convert PDFs directly in your browser. No uploads, no servers — 100% client-side." />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('pdf_render_theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
