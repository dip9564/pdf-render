<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="8" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222959" />
      <stop offset="55%" stop-color="#171C42" />
      <stop offset="100%" stop-color="#0D1029" />
    </linearGradient>
    <radialGradient id="docGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(46 47) rotate(135) scale(20)">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="paperGrad" x1="18" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DFE6FB" />
    </linearGradient>
    <linearGradient id="flapGrad" x1="38" y1="10" x2="48" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5F5" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="8" y1="17" x2="36" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B94BFF" />
      <stop offset="48%" stop-color="#6D5DFB" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
  </defs>

  <!-- Deep navy rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#docGlow)" />

  <!-- White PDF sheet with L-shaped cutout for folded corner -->
  <path
    d="M20 10H34.5V19C34.5 21.7614 36.7386 24 39.5 24H48V49C48 51.7614 45.7614 54 43 54H20C17.2386 54 15 51.7614 15 49V15C15 12.2386 17.2386 10 20 10Z"
    fill="url(#paperGrad)"
  />

  <!-- Separate folded top-right flap separated by navy L-groove -->
  <path
    d="M38 10L48 20H40.2C38.985 20 38 19.015 38 17.8V10Z"
    fill="url(#flapGrad)"
  />

  <!-- Document text lines -->
  <rect x="20.5" y="32.5" width="21.5" height="2.6" rx="1.3" fill="#8B96B8" />
  <rect x="20.5" y="37.2" width="21.5" height="2.6" rx="1.3" fill="#8B96B8" />
  <rect x="20.5" y="41.9" width="21.5" height="2.6" rx="1.3" fill="#8B96B8" />
  <rect x="20.5" y="46.6" width="15" height="2.6" rx="1.3" fill="#8B96B8" />

  <!-- Left ribbon fold under PDF badge -->
  <path d="M9 30H15V35L9 30Z" fill="#5B21B6" />

  <!-- Purple-to-teal-blue PDF badge -->
  <rect x="9" y="16.5" width="26.5" height="13.5" rx="3" fill="url(#ribbonGrad)" />

  <!-- Crisp geometric white PDF letters inside badge -->
  <path
    fill="#FFFFFF"
    d="M12.6 19.6h3.05c1.65 0 2.7.88 2.7 2.34 0 1.48-1.05 2.36-2.7 2.36h-1.45v2.45h-1.6v-7.15zm1.6 1.26v2.16h1.28c.77 0 1.22-.39 1.22-1.08 0-.69-.45-1.08-1.22-1.08h-1.28zm5.15-1.26h2.45c2.28 0 3.68 1.32 3.68 3.57s-1.4 3.58-3.68 3.58h-2.45v-7.15zm1.6 1.3v4.55h.88c1.32 0 2.04-.81 2.04-2.28 0-1.46-.72-2.27-2.04-2.27h-.88zm5.5-1.3h4.9v1.3h-3.3v1.68h2.92v1.26h-2.92v2.91h-1.6v-7.15z"
  />
</svg>
